<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quarterback Evolution Visualization</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    button {
      margin-right: 10px; margin-bottom: 20px;
      padding: 8px 16px;
      background-color: #444; color: #fff;
      border: none; border-radius: 4px;
      cursor: pointer;
    }
    .scene { display: none; }
    #scene1, #scene2, #scene3 { margin-top: 30px; }
    .narrative {
      max-width: 800px; margin-bottom: 20px;
      line-height: 1.5; color: #333;
    }
    #scene3-annotation p {
      font-size: 14px; font-weight: bold;
      color: darkslategray;
    }
  </style>
</head>
<body>
  <h1>Quarterback Evolution Over Time</h1>

  <!-- scene navigation -->
  <div>
    <button onclick="showScene('scene1')">Scene 1: Passing Yards</button>
    <button onclick="showScene('scene2')">Scene 2: Completion %</button>
    <button onclick="showScene('scene3')">Scene 3: Top Players</button>
  </div>

  <!-- scenes -->
  <div id="scene1" class="scene"></div>
  <div id="scene2" class="scene"></div>
  <div id="scene3" class="scene"></div>

  <script src="script.js"></script>
  <script>showScene('scene1');</script>
</body>
</html>
